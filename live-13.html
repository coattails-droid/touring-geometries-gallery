<script>
(function () {
  var td = (typeof tokenData !== "undefined") ? tokenData : { tokenId: 0, hash: "0x" + "00".repeat(32) };
  var hash = td.hash;
  var geo = Touring3D.geoFromHash(hash);
  var cloud = Touring3D.buildPointCloud(geo.hash, geo, null);
  var canvas = document.getElementById("tg");
  var ctx = canvas.getContext("2d");
  function fit() {
    var s = Math.min(window.innerWidth, window.innerHeight);
    canvas.width = s; canvas.height = s;
    canvas.style.width = s + "px"; canvas.style.height = s + "px";
  }
  fit();
  var FPS = 30, LOOP = 16;
  var renderer = Touring3D.createRenderer(cloud, canvas.width);
  var t0 = performance.now(), lastDraw = -1, rafId = 0;
  function tick() {
    var t = ((performance.now() - t0) / 1000) % LOOP;
    var frame = Math.floor(t * FPS);
    if (frame !== lastDraw) {
      lastDraw = frame;
      renderer.drawFrame(frame / FPS, ctx);
    }
    rafId = requestAnimationFrame(tick);
  }
  tick();
  var audioBtn = document.getElementById("tg-audio");
  audioBtn.addEventListener("click", function () {
    if (TGAudio.playing()) {
      TGAudio.stop();
      audioBtn.classList.remove("on");
      audioBtn.innerHTML = "&#9834;";
    } else {
      var vt = ((performance.now() - t0) / 1000) % LOOP;
      TGAudio.start(cloud, hash, vt);
      audioBtn.classList.add("on");
      audioBtn.innerHTML = "&#9632;";
    }
  });
  window.addEventListener("resize", function () {
    cancelAnimationFrame(rafId);
    fit();
    renderer = Touring3D.createRenderer(cloud, canvas.width);
    t0 = performance.now(); lastDraw = -1;
    tick();
  });
})();
</script>
